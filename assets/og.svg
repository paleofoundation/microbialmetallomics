  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#1a1a1a">Every cell runs on metal.</text>
  <text x="90" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#006f5b">Microbes fight wars over it.</text>
  <text x="90" y="486" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#4a4a4a">The comprehensive, cited field guide to metals in the microbial world —</text>
  <text x="90" y="526" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#4a4a4a">the science, the papers, the microbiome, and the who's who.</text>
